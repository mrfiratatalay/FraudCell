name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BACKEND
    steps:
      - uses: actions/checkout@v7
      # global.json is the single source of truth for the SDK version; the
      # Dockerfiles pin the same version.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: BACKEND/global.json
      - run: dotnet restore FraudCell.sln
      - run: dotnet build FraudCell.sln -c Release --no-restore --nologo
      - run: dotnet test FraudCell.sln -c Release --no-build --nologo

  ai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BACKEND/src/Ai/fraudcell-ai
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.11.31
      - run: uv sync --frozen --group dev --group test
      - run: uv run --group dev --group test ruff check app tests
      - run: uv run --group dev --group test mypy app
      - run: uv run --group test pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FRONTEND/app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: FRONTEND/app/.nvmrc
          cache: npm
          cache-dependency-path: FRONTEND/app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run contracts:generate
      # Generated API types must match the committed OpenAPI snapshots.
      - run: git diff --exit-code -- src/shared/api/generated
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose --env-file .env.example -f docker-compose.yml config --quiet
        working-directory: BACKEND

  # Case section 11.3 on a clean machine: docker compose up, the mandatory
  # demo flow, then a stopped AI service. Runs after the fast checks pass.
  demo-e2e:
    needs: [dotnet, ai, frontend, compose-config]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: BACKEND
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - name: docker compose up (builds every image, trains the AI model)
        run: docker compose up -d --build
      - name: Demo steps 2-6 (transaction, AI, assignment, block, leaderboard)
        run: python3 ../scripts/demo.py smoke
      - name: Demo step 7 (stop ai-service)
        run: docker compose stop ai-service
      - name: Transactions still work without AI
        run: python3 ../scripts/demo.py ai-down
      - name: Start ai-service again
        run: docker compose up -d --wait --no-deps ai-service
      - name: Resilience (stop each container in turn, RabbitMQ included)
        run: python3 ../scripts/demo.py resilience
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail=300
      - name: Tear down
        if: always()
        run: docker compose down -v
