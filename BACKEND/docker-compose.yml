name: fraudcell

# Full production-like demo topology. Tum sistemi tek komutla ayaga kaldirmak
# icin: scripts/start-fraudcell.bat (durdurma: scripts/stop-fraudcell.bat).
#
# Data ownership (database-per-service): every service has its OWN PostgreSQL
# instance on its OWN internal network. Only the owner service joins that
# network, so no other container can even open a connection to the database.
# Inside each instance the service logs in with a non-superuser role that owns
# only its database (docker/postgres/init-multiple-databases.sh).
x-application-security: &application-security
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  stop_grace_period: 30s
  restart: on-failure:5

x-postgres: &postgres
  image: postgres:18.4
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
    interval: 10s
    timeout: 5s
    retries: 10
    start_period: 20s
  cpus: 0.50
  mem_limit: 256m
  mem_reservation: 96m
  pids_limit: 256
  stop_grace_period: 20s
  restart: on-failure:5

x-postgres-environment: &postgres-environment
  POSTGRES_DB: postgres
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD must be set in BACKEND/.env}

x-postgres-init: &postgres-init ./docker/postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/10-fraudcell-databases.sh:ro

networks:
  fraudcell-app:
    name: fraudcell-app
  # One internal network per database; only the owner service joins it.
  identity-db:
    internal: true
  transaction-db:
    internal: true
  gamification-db:
    internal: true
  ai-db:
    internal: true

volumes:
  identity-db-data:
  transaction-db-data:
  gamification-db-data:
  ai-db-data:
  rabbitmq-data:
  identity-keys:

services:
  postgres-identity:
    <<: *postgres
    environment:
      <<: *postgres-environment
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?IDENTITY_DB_PASSWORD must be set in BACKEND/.env}
    volumes:
      - identity-db-data:/var/lib/postgresql
      - *postgres-init
    networks:
      - identity-db

  postgres-transaction:
    <<: *postgres
    environment:
      <<: *postgres-environment
      TRANSACTION_DB_PASSWORD: ${TRANSACTION_DB_PASSWORD:?TRANSACTION_DB_PASSWORD must be set in BACKEND/.env}
    volumes:
      - transaction-db-data:/var/lib/postgresql
      - *postgres-init
    networks:
      - transaction-db

  postgres-gamification:
    <<: *postgres
    environment:
      <<: *postgres-environment
      GAMIFICATION_DB_PASSWORD: ${GAMIFICATION_DB_PASSWORD:?GAMIFICATION_DB_PASSWORD must be set in BACKEND/.env}
    volumes:
      - gamification-db-data:/var/lib/postgresql
      - *postgres-init
    networks:
      - gamification-db

  postgres-ai:
    <<: *postgres
    environment:
      <<: *postgres-environment
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:?AI_DB_PASSWORD must be set in BACKEND/.env}
    volumes:
      - ai-db-data:/var/lib/postgresql
      - *postgres-init
    networks:
      - ai-db

  rabbitmq:
    image: rabbitmq:4.3
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-fraudcell}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in BACKEND/.env}
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - fraudcell-app
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    cpus: 0.50
    mem_limit: 384m
    mem_reservation: 160m
    pids_limit: 256
    stop_grace_period: 30s
    restart: on-failure:5

  identity-service:
    <<: *application-security
    build:
      context: .
      dockerfile: src/Services/Identity/FraudCell.Identity.Service/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__IdentityDb: Host=postgres-identity;Port=5432;Database=fraudcell_identity;Username=identity_app;Password=${IDENTITY_DB_PASSWORD};Minimum Pool Size=0;Maximum Pool Size=15
      RabbitMq__Host: rabbitmq
      RabbitMq__UserName: ${RABBITMQ_USER:-fraudcell}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      Jwt__PrivateKeyPath: /keys/identity/private.pem
      Jwt__PublicKeyPath: /keys/identity/public.pem
      Seed__AdminEmail: ${SEED_ADMIN_EMAIL:-admin@fraudcell.local}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:-ChangeMe123!}
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: Warning
      Serilog__MinimumLevel__Override__Microsoft.EntityFrameworkCore.Database.Command: Warning
    volumes:
      - identity-keys:/keys/identity
    depends_on:
      postgres-identity:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - fraudcell-app
      - identity-db
    cpus: 0.40
    mem_limit: 384m
    mem_reservation: 128m

  transaction-service:
    <<: *application-security
    build:
      context: .
      dockerfile: src/Services/Transaction/FraudCell.Transaction.Service/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__TransactionDb: Host=postgres-transaction;Port=5432;Database=fraudcell_transaction;Username=transaction_app;Password=${TRANSACTION_DB_PASSWORD};Minimum Pool Size=0;Maximum Pool Size=15
      RabbitMq__Host: rabbitmq
      RabbitMq__UserName: ${RABBITMQ_USER:-fraudcell}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      Jwt__PublicKeyPath: /keys/identity/public.pem
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: Warning
      Serilog__MinimumLevel__Override__Microsoft.EntityFrameworkCore.Database.Command: Warning
    volumes:
      - identity-keys:/keys/identity:ro
    depends_on:
      postgres-transaction:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    networks:
      - fraudcell-app
      - transaction-db
    cpus: 0.60
    mem_limit: 512m
    mem_reservation: 160m

  # Tek seferlik semа gorevleri icin manuel arac. Normal `docker compose up`
  # sirasinda BASLAMAZ; ai-service kendi migration'ini startup'ta uygular
  # (Identity/Transaction/Gamification ile ayni desen).
  #   docker compose --profile migration run --rm ai-migrate
  ai-migrate:
    profiles: ["migration"]
    image: fraudcell-ai-service:latest
    build:
      context: .
      dockerfile: src/Ai/fraudcell-ai/Dockerfile
    command: ["python", "-m", "app.migrate"]
    environment: &ai-environment
      AI_DB_HOST: postgres-ai
      AI_DB_PORT: 5432
      AI_DB_NAME: fraudcell_ai
      AI_DB_USER: ai_app
      AI_DB_PASSWORD: ${AI_DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER_NAME: ${RABBITMQ_USER:-fraudcell}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      INTERNAL_API_TOKEN: ${AI_INTERNAL_API_TOKEN:-local-development-only}
      # Yalnizca aciklama anlatisi icin (skorlamayi ETKILEMEZ). Bos ise ozellik
      # sessizce deterministik ozete duser.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      postgres-ai:
        condition: service_healthy
    networks:
      - ai-db
    cpus: 0.50
    mem_limit: 512m
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  ai-service:
    <<: *application-security
    image: fraudcell-ai-service:latest
    build:
      context: .
      dockerfile: src/Ai/fraudcell-ai/Dockerfile
    environment: *ai-environment
    depends_on:
      postgres-ai:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - fraudcell-app
      - ai-db
    cpus: 1.25
    mem_limit: 1024m
    mem_reservation: 384m

  gamification-service:
    <<: *application-security
    build:
      context: .
      dockerfile: src/Services/Gamification/FraudCell.Gamification.Service/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__GamificationDb: Host=postgres-gamification;Port=5432;Database=fraudcell_gamification;Username=gamification_app;Password=${GAMIFICATION_DB_PASSWORD};Minimum Pool Size=0;Maximum Pool Size=15
      RabbitMq__Host: rabbitmq
      RabbitMq__UserName: ${RABBITMQ_USER:-fraudcell}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      Jwt__PublicKeyPath: /keys/identity/public.pem
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: Warning
      Serilog__MinimumLevel__Override__Microsoft.EntityFrameworkCore.Database.Command: Warning
    volumes:
      - identity-keys:/keys/identity:ro
    depends_on:
      postgres-gamification:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    networks:
      - fraudcell-app
      - gamification-db
    cpus: 0.40
    mem_limit: 384m
    mem_reservation: 128m

  # Tek giris noktasi. Frontend SPA'i da wwwroot'tan servis eder, bu yuzden
  # ayri bir frontend/nginx container'i yoktur.
  edge-gateway:
    <<: *application-security
    build:
      context: ..
      dockerfile: BACKEND/src/Services/Edge/FraudCell.Edge.Gateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      Jwt__PublicKeyPath: /keys/identity/public.pem
      RabbitMq__Host: rabbitmq
      RabbitMq__UserName: ${RABBITMQ_USER:-fraudcell}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      ReverseProxy__Clusters__identity__Destinations__identity-service__Address: http://identity-service:8080/
      ReverseProxy__Clusters__transaction__Destinations__transaction-service__Address: http://transaction-service:8080/
      ReverseProxy__Clusters__gamification__Destinations__gamification-service__Address: http://gamification-service:8080/
      ReverseProxy__Clusters__ai__Destinations__ai-service__Address: http://ai-service:8000/
      Logging__LogLevel__Yarp: Warning
      Serilog__MinimumLevel__Override__Yarp: Warning
    volumes:
      - identity-keys:/keys/identity:ro
    # Only Identity must be healthy: it creates the JWT signing key the gateway
    # reads. The other services may still be starting or even down; the gateway
    # comes up anyway and returns 502/503 for their routes until they are back.
    depends_on:
      identity-service:
        condition: service_healthy
      transaction-service:
        condition: service_started
      gamification-service:
        condition: service_started
      ai-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - fraudcell-app
    ports:
      - "127.0.0.1:8080:8080"
    cpus: 0.40
    mem_limit: 256m
    mem_reservation: 96m

  # One-shot job: creates the demo staff (one analyst per fraud specialty and a
  # supervisor) through the public API once every service is up, so the
  # identity.staff.profile.updated events reach queues that already exist.
  # Idempotent; exits after it runs. Re-run: docker compose run --rm demo-seed
  demo-seed:
    image: python:3.13.14-slim-bookworm
    command: ["python", "-I", "/demo/demo.py", "seed"]
    environment:
      FRAUDCELL_BASE_URL: http://edge-gateway:8080
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@fraudcell.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe123!}
      DEMO_STAFF_PASSWORD: ${DEMO_STAFF_PASSWORD:-Demo1234!}
    volumes:
      - ../scripts/demo.py:/demo/demo.py:ro
    depends_on:
      edge-gateway:
        condition: service_healthy
      transaction-service:
        condition: service_healthy
      gamification-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks:
      - fraudcell-app
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
