# Serves the SPA behind the edge gateway, which adds the security headers.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Vite puts content-hashed files here, so they can be cached for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # An unknown API path is an error, not a page of the SPA.
    location /api/ {
        return 404;
    }

    # Client-side routes (for example /cases/123) all load index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
